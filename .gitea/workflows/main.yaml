name: main

on:
  push:
    branches: [0.8.26-cont]
  pull_request:
    branches: [0.8.26-cont]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: true
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
  SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
  SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
  SCCACHE_SERVER_PORT: ${{ vars.SCCACHE_SERVER_PORT }}
  SCCACHE_S3_USE_SSL: ${{ vars.SCCACHE_S3_USE_SSL }}
  RUSTC_WRAPPER: sccache

jobs:
  build-test-check-clippy:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: install rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
          components: clippy
          cache-all-crates: "true"
          build-warnings: warn

      - name: use sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "${{ vars.SCCACHE_VERSION }}"

      - name: run cargo build main
        run: cargo build --all --release

      - name: run cargo test
        run: cargo test

      - name: run cargo check
        run: cargo check

      - name: run clippy
        run: cargo clippy --

  format:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: install latest rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
          components: rustfmt
          build-warnings: warn

      - name: format check
        run: cargo fmt -- --check

  conventional-commits:
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v7

    - name: conventional commits
      uses: webiny/action-conventional-commits@7f91b1595ca1951cdb671ddc9f07a49081ec5b69 # v1.4.2
